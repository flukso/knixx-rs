name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev libdbus-1-dev pkg-config
      - name: Toolchain
        run: rustup show
      - name: flip-link
        run: cargo install flip-link --locked
      - name: Host tests
        run: cargo test
      - name: Lint
        run: |
          cargo clippy --all-targets -- -D warnings
          (cd firmware && cargo clippy --release -- -D warnings)
      - name: Format
        run: |
          cargo fmt --check
          (cd firmware && cargo fmt --check)
      - name: no_std crates
        # knixx-storage's littlefs C library builds with clang and
        # firmware/c-include, as in firmware/.cargo/config.toml.
        env:
          CC_thumbv7em_none_eabihf: clang
          CFLAGS_thumbv7em_none_eabihf: -ffreestanding -mcpu=cortex-m4
        run: |
          export CPATH="$PWD/firmware/c-include"
          for c in crates/*; do (cd $c && cargo build --target thumbv7em-none-eabihf) || exit 1; done
      - name: Firmware build and size
        run: cargo xtask build
      - name: cargo-bloat
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-bloat
      - name: Flash by crate
        run: cd firmware && cargo bloat --release --crates -n 20
      - name: Licenses
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses
