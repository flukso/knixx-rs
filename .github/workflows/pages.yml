name: pages

# The web app on GitHub Pages: Web Bluetooth needs HTTPS, which Pages gives.
# The repository's Pages source must be "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ["web/**", "crates/knixx-knx/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        # web/rust-toolchain.toml, with the wasm32 target.
        run: cd web && rustup show
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: Build
        # The app is served from /<repository>/.
        run: cd web && trunk build --release --public-url "/${GITHUB_REPOSITORY#*/}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
