name: release

# A pushed tag v* gets a GitHub release with the firmware and bolt attached.
# Run it by hand with a tag to add the files to an existing release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release, e.g. v0.3.1"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  firmware:
    # Ubuntu 24.04 and its clang 18: with 26.04's clang 21, the bindgen of
    # nrf-mpsl-sys finds no stdint.h for the nRF52840.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev pkg-config
      - name: Toolchain
        run: rustup show
      - name: flip-link
        run: cargo install flip-link --locked
      - name: Build
        # The bootloader and the firmware, every feature in, the image
        # signed with the release key (key 1, keys/1-release.pub):
        # build/thunder.{kfw,elf} and build/thunder-boot.{hex,elf}. Tags up
        # to v0.5.1 build knixx.* or thunder.uf2 instead, which this
        # workflow does not collect.
        env:
          KNIXX_SIGNING_KEY: ${{ secrets.KNIXX_SIGNING_KEY }}
          KNIXX_SIGNING_KEY_ID: "1"
        run: |
          if [ -z "$KNIXX_SIGNING_KEY" ]; then
            echo "the KNIXX_SIGNING_KEY secret is not set: cargo xtask keygen 1 release <seed file>" >&2
            exit 1
          fi
          cargo xtask build
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          if-no-files-found: error
          path: |
            build/thunder.kfw
            build/thunder.elf
            build/thunder-boot.hex
            build/thunder-boot.elf

  bolt:
    strategy:
      matrix:
        include:
          # Ubuntu 22.04's glibc 2.35, so the Linux builds also run on
          # Debian 12 and Raspberry Pi OS.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Toolchain
        run: rustup show
      - name: Build
        run: cargo build --release --locked -p bolt
      - name: Package
        run: |
          d=bolt-$TAG-${{ matrix.target }}
          mkdir $d
          cp target/release/bolt LICENSE $d/
          tar czf $d.tar.gz $d
      - uses: actions/upload-artifact@v4
        with:
          name: bolt-${{ matrix.target }}
          path: bolt-*.tar.gz

  release:
    needs: [firmware, bolt]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          ls -l dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            # Named after the version alone, 0.4.1 for v0.4.1; the tag's
            # message gives the notes.
            gh release create "$TAG" dist/* --verify-tag --notes-from-tag --title "${TAG#v}"
          fi
