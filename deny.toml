# cargo deny check: the firmware and the host tools stay MIT-licensed, so no
# copyleft dependencies (metaneutrons/knx-rs is GPL-3.0: reference only).
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
]
confidence-threshold = 0.9
# Permissive licenses of single crates, allowed per crate rather than
# globally. CC0-1.0 is a public-domain dedication: tiny-keccak comes in via
# rhai -> ahash -> const-random, base16 via the web app's leptos. BSL-1.0, the
# Boost license: xxhash-rust, via leptos too.
exceptions = [
    { crate = "tiny-keccak", allow = ["CC0-1.0"] },
    { crate = "base16", allow = ["CC0-1.0"] },
    { crate = "xxhash-rust", allow = ["BSL-1.0"] },
]

[bans]
multiple-versions = "allow"
