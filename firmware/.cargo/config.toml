[build]
target = "thumbv7em-none-eabihf"

[target.thumbv7em-none-eabihf]
# flip-link puts the stack below .data/.bss, so an overflow faults instead
# of corrupting statics.
linker = "flip-link"
rustflags = ["-C", "link-arg=-Tlink.x"]

# The littlefs C library (knixx-storage) is compiled with clang and the
# freestanding headers it brings, plus c-include/ for the few C library
# functions littlefs declares: no C library is needed.
[env]
CC_thumbv7em_none_eabihf = "clang"
CFLAGS_thumbv7em_none_eabihf = "-ffreestanding -mcpu=cortex-m4"
CPATH = { value = "c-include", relative = true }
