# The firmware workspace, built for the nRF52840 (see .cargo/config.toml).
# The host workspace at the repository root holds the shared no_std crates,
# the host tools and xtask.
[workspace]
resolver = "3"
members = ["knixx-fw", "knixx-qspi", "knixx-boot"]
# The firmware and the bootloader each build on their own: their critical
# sections (MPSL's, and the bootloader's single-core one) cannot be
# unified into one build. cargo build -p knixx-boot --profile boot builds
# the bootloader.
default-members = ["knixx-fw"]

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = 2
panic = "abort"

# The ed25519 verifier checks an image once per update: small matters, not
# fast.
[profile.release.package.ed25519-compact]
opt-level = "z"

[profile.dev]
opt-level = "s"
panic = "abort"

# The bootloader, smallest: cargo build --profile boot -p knixx-boot.
[profile.boot]
inherits = "release"
opt-level = "z"
