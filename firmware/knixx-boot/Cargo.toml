[package]
name = "knixx-boot"
version = "0.1.0"
description = "The bootloader of knixx thunder: boots the application, installs a staged image from the QSPI flash, and takes an image over USB in recovery"
edition = "2024"

[dependencies]
cortex-m = { version = "0.7.10", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.7"
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-futures = "0.1.2"
embassy-nrf = { version = "0.11.0", features = ["nrf52840", "time-driver-rtc1", "unstable-pac"] }
embassy-time = "0.5.1"
embassy-usb = "0.6.0"
embedded-storage = "0.3"
static_cell = "2.1.1"
ed25519-compact = { version = "2.6.0", default-features = false, features = ["opt_size"] }
knixx-image = { path = "../../crates/knixx-image" }
knixx-xfer = { path = "../../crates/knixx-xfer" }
knixx-storage = { path = "../../crates/knixx-storage" }
knixx-qspi = { path = "../knixx-qspi" }
