[package]
name = "knixx-fw"
version = "0.1.0"
edition = "2024"

[dependencies]
embedded-io-async = "0.7"
knixx-bus = { path = "../../crates/knixx-bus" }
knixx-cli = { path = "../../crates/knixx-cli" }
knixx-console = { path = "../../crates/knixx-console" }
knixx-device = { path = "../../crates/knixx-device" }
knixx-knx = { path = "../../crates/knixx-knx" }
knixx-sensors = { path = "../../crates/knixx-sensors" }
knixx-vl53l7cx = { path = "../../crates/knixx-vl53l7cx" }
embedded-hal-async = "1"
knixx-storage = { path = "../../crates/knixx-storage" }
knixx-ui = { path = "../../crates/knixx-ui" }
cortex-m = "0.7.10"
cortex-m-rt = { version = "0.7.7", features = ["set-vtor"] }
embassy-embedded-hal = "0.6"
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-futures = "0.1.2"
embassy-nrf = { version = "0.11.0", features = ["nrf52840", "time-driver-rtc1", "gpiote", "unstable-pac"] }
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
embassy-usb = "0.6.0"
nrf-mpsl = { version = "0.4.0", features = ["nrf52840", "critical-section-impl"] }
nrf-sdc = { version = "0.4.0", features = ["nrf52840", "peripheral"] }
static_cell = "2.1.1"
heapless = "0.9"
rlsf = { version = "0.2.3", optional = true }
knixx-script = { path = "../../crates/knixx-script", default-features = false, features = ["no_std"], optional = true }
bt-hci = { version = "0.10.1", default-features = false }
trouble-host = { version = "0.8.0", default-features = false, features = ["peripheral", "gatt", "default-packet-pool", "derive", "security", "security-p256-cortex-m4"] }

[features]
# Every feature is in by default: the one build, thunder.uf2. cargo xtask
# build --no-scripts, --no-web-ble and --no-coded-phy leave them out.
default = ["scripts", "web-ble", "coded-phy"]
# Scripts in Rhai Grain, with the heap that only they use. Without it the
# firmware links no allocator.
scripts = ["dep:rlsf", "dep:knixx-script"]
# The knixx GATT service, for a web app on Web Bluetooth: group value writes,
# reads and responses through the board, and the group telegrams on the bus.
# It serves only with ble.knixx on.
web-ble = []
# Long-range advertising and connections on the LE Coded PHY, next to 1M:
# the controller's multirole library (extended advertising, coded PHY) and
# trouble's extended advertising. The coded set is on only with ble.coded on.
coded-phy = ["nrf-sdc/multirole", "trouble-host/extended-advertising"]
