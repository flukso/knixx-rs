[package]
name = "bolt"
version = "0.1.0"
description = "Host tool for knixx boards"
edition.workspace = true
license.workspace = true

[dependencies]
knixx-host = { path = "../knixx-host" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tokio = { version = "1", features = ["rt", "time"] }
