[package]
name = "bolt"
version = "0.1.0"
description = "Host tool for knixx boards"
edition.workspace = true
license.workspace = true

[dependencies]
knixx-host = { path = "../knixx-host" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
btleplug = "0.13.5"
futures-util = "0.3.34"
uuid = "1.29.0"
crossterm = "0.29.0"
serialport = { version = "4.10.1", default-features = false }
