[package]
name = "knixx-host"
version = "0.1.0"
description = "Host-side support for knixx boards: firmware images and flashing"
edition.workspace = true
license.workspace = true

[dependencies]
object = { version = "0.36", default-features = false, features = ["read_core", "elf", "std"] }
thiserror = "2"
# Without libudev: Linux ports are found through sysfs instead.
serialport = { version = "4", default-features = false }
# BLE scanning, for bolt. On Linux btleplug talks to BlueZ over D-Bus and
# needs libdbus to build; the firmware build (xtask) does without.
btleplug = { version = "0.13.5", optional = true }
tokio = { version = "1.54.1", features = ["rt", "time", "macros"], optional = true }
futures-util = { version = "0.3.34", optional = true }
zip = { version = "9.1.2", default-features = false, features = ["deflate"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[features]
default = ["ble"]
ble = ["dep:btleplug", "dep:tokio", "dep:futures-util"]
