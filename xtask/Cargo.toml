[package]
name = "xtask"
version = "0.1.0"
description = "Build, flash and test tasks: cargo xtask <task>"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# Without BLE, so that building the firmware needs no D-Bus on Linux; the
# cycle task runs bolt scan instead.
knixx-host = { path = "../host/knixx-host", default-features = false }
anyhow = "1"
